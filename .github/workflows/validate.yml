name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run validate
        working-directory: frontend
      - run: git diff --exit-code -- custom_components/niak_comfort/frontend/
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
        working-directory: card
      - run: npm run validate
        working-directory: card
      - run: git diff --exit-code -- custom_components/niak_comfort/frontend/niak-comfort-card.js
      - run: npx playwright install --with-deps chromium firefox
        working-directory: card
      - run: npm run test:loading
        working-directory: card
        env:
          NIAK_TEST_FIREFOX: "1"
      - run: npm --prefix ../frontend run test:browser
        working-directory: card
        env:
          NIAK_TEST_COMFORT_ONLY: "1"
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
