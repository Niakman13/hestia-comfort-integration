import '../../../custom_components/niak_comfort/frontend/niak-comfort-card.js';
const scenes=await(await fetch('./real-fixtures.json')).json();const selector=document.querySelector('#scenario'),theme=document.querySelector('#theme'),format=document.querySelector('#format'),card=document.querySelector('niak-comfort-card'),home=document.querySelector('niak-comfort-home-card');const listeners=new Set();
